version: "3.9"
services:
  app:
    image: python:3.10-slim
    working_dir: /app
    environment:
      - MPLBACKEND=Agg
    volumes:
      - ./:/app
    # Uncomment devices to access host webcam inside container
    # devices:
    #   - "/dev/video0:/dev/video0"
    command: >
      bash -lc "
        apt-get update && \
        apt-get install -y --no-install-recommends libgl1 libglib2.0-0 && \
        pip install --upgrade pip && \
        pip install -r requirements.txt && \
        python -m ml_models.cnn_image.train --help
      "
